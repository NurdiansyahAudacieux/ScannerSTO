<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Barcode Scanner - SPX Express</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a0a;
      color: white;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .header {
      background: #113367;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header h1 { font-size: 16px; font-weight: 600; }
    .header p { font-size: 11px; opacity: 0.75; }
    .btn-close {
      margin-left: auto;
      background: rgba(255,255,255,0.2);
      border: none;
      color: white;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .scanner-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    #reader {
      width: 100%;
      max-width: 400px;
      border-radius: 12px;
      overflow: hidden;
    }
    #reader video { border-radius: 12px; }
    .status {
      margin-top: 16px;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 14px;
      text-align: center;
      max-width: 400px;
      width: 100%;
    }
    .status.scanning {
      background: rgba(17, 51, 103, 0.3);
      border: 1px solid rgba(17, 51, 103, 0.5);
      color: #8bb4ff;
    }
    .status.success {
      background: rgba(34, 197, 94, 0.2);
      border: 1px solid rgba(34, 197, 94, 0.4);
      color: #86efac;
    }
    .status.error {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
    }
    .hint {
      margin-top: 8px;
      font-size: 12px;
      color: #888;
      text-align: center;
    }
    .result-box {
      margin-top: 12px;
      background: rgba(255,255,255,0.1);
      padding: 12px 16px;
      border-radius: 8px;
      font-family: monospace;
      font-size: 16px;
      text-align: center;
      word-break: break-all;
      max-width: 400px;
      width: 100%;
    }
    .btn-manual {
      margin-top: 16px;
      background: #113367;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    /* Hide html5-qrcode UI clutter */
    #reader__dashboard { display: none !important; }
    #reader img[alt="Info icon"] { display: none !important; }
    #reader__header_message { display: none !important; }
    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      color: #aaa;
    }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: #113367;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .manual-input-area {
      margin-top: 16px;
      max-width: 400px;
      width: 100%;
      display: none;
    }
    .manual-input-area.show { display: block; }
    .manual-input-area input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #1a1a1a;
      color: white;
      font-size: 16px;
      font-family: monospace;
    }
    .manual-input-area .btn-submit {
      margin-top: 8px;
      width: 100%;
      background: #22c55e;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .manual-input-area .btn-submit:disabled {
      background: #333;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <h1>Barcode Scanner</h1>
      <p id="fieldLabel">Scanning...</p>
    </div>
    <button class="btn-close" onclick="cancelAndClose()" title="Tutup">✕</button>
  </div>

  <div class="scanner-area">
    <div id="loadingState" class="loading">
      <div class="spinner"></div>
      <p>Memulai kamera...</p>
    </div>
    <div id="reader"></div>
    <div id="statusMsg" class="status scanning" style="display:none;">
      Arahkan kamera ke barcode...
    </div>
    <div id="resultBox" class="result-box" style="display:none;"></div>
    <p class="hint" id="hintText"></p>

    <button class="btn-manual" id="manualBtn" onclick="toggleManualInput()" style="display:none;">
      ✏️ Input Manual
    </button>
    <div class="manual-input-area" id="manualArea">
      <input type="text" id="manualInput" placeholder="Ketik barcode manual..." oninput="validateManual()">
      <button class="btn-submit" id="manualSubmit" onclick="submitManual()" disabled>Kirim</button>
    </div>
  </div>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script>
    // Parse URL parameters
    const params = new URLSearchParams(window.location.search);
    const field = params.get('field') || 'unknown';
    const patternStr = params.get('pattern') || '.*';
    const hint = params.get('hint') || '';
    const fieldId = params.get('fieldId') || '';
    const pattern = new RegExp(patternStr);

    // UI labels
    const labels = {
      serialNumber: 'Serial Number (MT...)',
      spxId: 'SPX-ID (ID-SPXID-...)'
    };
    document.getElementById('fieldLabel').textContent = labels[field] || field;
    document.getElementById('hintText').textContent = hint;

    let scanner = null;
    let sent = false;

    // Send result back to opener
    function sendResult(value) {
      if (sent) return;
      sent = true;
      
      // Show success
      document.getElementById('statusMsg').className = 'status success';
      document.getElementById('statusMsg').textContent = '✅ Barcode terdeteksi!';
      document.getElementById('statusMsg').style.display = 'block';
      document.getElementById('resultBox').textContent = value;
      document.getElementById('resultBox').style.display = 'block';

      // Send to opener via postMessage
      if (window.opener) {
        window.opener.postMessage({
          type: 'BARCODE_SCAN_RESULT',
          field: field,
          fieldId: fieldId,
          value: value
        }, '*');
      }

      // Auto close after delay
      setTimeout(() => {
        try { window.close(); } catch(e) {}
      }, 1200);
    }

    function cancelAndClose() {
      if (scanner) {
        try { scanner.stop(); } catch(e) {}
      }
      if (window.opener) {
        window.opener.postMessage({
          type: 'BARCODE_SCAN_CANCEL',
          field: field,
          fieldId: fieldId
        }, '*');
      }
      try { window.close(); } catch(e) {
        document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#aaa;">Scanner ditutup. Anda bisa menutup tab ini.</div>';
      }
    }

    function toggleManualInput() {
      const area = document.getElementById('manualArea');
      area.classList.toggle('show');
      if (area.classList.contains('show')) {
        document.getElementById('manualInput').focus();
      }
    }

    function validateManual() {
      const val = document.getElementById('manualInput').value.trim();
      document.getElementById('manualSubmit').disabled = !pattern.test(val);
    }

    function submitManual() {
      const val = document.getElementById('manualInput').value.trim();
      if (pattern.test(val)) {
        sendResult(val);
      }
    }

    // Start scanner
    async function startScanner() {
      try {
        scanner = new Html5Qrcode('reader');
        
        await scanner.start(
          { facingMode: 'environment' },
          {
            fps: 10,
            qrbox: { width: 280, height: 120 },
            aspectRatio: window.innerWidth > 500 ? 1.5 : 1.0,
            formatsToSupport: [
              Html5QrcodeSupportedFormats.CODE_128,
              Html5QrcodeSupportedFormats.CODE_39,
              Html5QrcodeSupportedFormats.EAN_13,
              Html5QrcodeSupportedFormats.EAN_8,
              Html5QrcodeSupportedFormats.QR_CODE,
              Html5QrcodeSupportedFormats.DATA_MATRIX,
              Html5QrcodeSupportedFormats.CODE_93
            ]
          },
          (decodedText) => {
            if (sent) return;
            const value = decodedText.trim();
            if (pattern.test(value)) {
              // Valid barcode
              scanner.stop().catch(() => {});
              sendResult(value);
            } else {
              // Show scanned value but format wrong
              document.getElementById('statusMsg').className = 'status error';
              document.getElementById('statusMsg').textContent = 'Format tidak sesuai: ' + value;
              document.getElementById('statusMsg').style.display = 'block';
            }
          },
          () => {} // ignore continuous errors
        );

        // Scanner started successfully
        document.getElementById('loadingState').style.display = 'none';
        document.getElementById('statusMsg').className = 'status scanning';
        document.getElementById('statusMsg').textContent = '🔍 Arahkan kamera ke barcode...';
        document.getElementById('statusMsg').style.display = 'block';
        document.getElementById('manualBtn').style.display = 'inline-block';

      } catch (err) {
        console.error('Scanner error:', err);
        document.getElementById('loadingState').style.display = 'none';
        document.getElementById('statusMsg').className = 'status error';
        document.getElementById('statusMsg').innerHTML = '❌ Gagal mengakses kamera.<br>Pastikan izin kamera sudah diberikan, atau gunakan input manual di bawah.';
        document.getElementById('statusMsg').style.display = 'block';
        document.getElementById('manualBtn').style.display = 'inline-block';
        document.getElementById('manualBtn').click(); // auto show manual input
      }
    }

    // Handle Enter key in manual input
    document.getElementById('manualInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        const val = e.target.value.trim();
        if (pattern.test(val)) submitManual();
      }
    });

    // Start
    startScanner();
  </script>
</body>
</html>
